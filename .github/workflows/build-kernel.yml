name: build-oneplus9-droidspaces

# 一加9 (LE2110 / ColorOS 14 / 5.4.254-qgki) · Droidspaces 内核云编译
#
# 关键结构（这决定了为什么必须拉两个仓库）：
#   OnePlusOSS 的内核仓库里有 114 个符号链接指向 vendor/oplus/...，
#   例如 kernel/sched_assist -> ../../../vendor/oplus/kernel/oplus_performance/sched_assist/
#   也就是说原厂是在完整 Android 源码树里编的，单独克隆内核仓库必然断链。
#   缺失的那棵树在 android_kernel_modules_and_devicetree_oneplus_sm8350 里。
#   所以目录必须是：
#       src/kernel/msm-5.4/   <- 内核仓库
#       src/vendor/           <- 模块与设备树仓库的 vendor/ 子树
#   这样 kernel/sched_assist 往上三级正好落到 src/vendor/oplus/...
#
# 几个必须守住的点（都是别人踩过的坑）：
#   1. 编译器必须是 clang 11.0.2 (r383902b)：手机 /proc/version 实机确认
#      "Android (6877366 based on r383902b1) clang version 11.0.2"。
#      换版本会改变 CFI 类型哈希，厂商模块的间接调用会对不上。
#   2. CONFIG_CFI_CLANG / LTO / SCS 必须保持开启，olddefconfig 后复查。
#   3. LOCALVERSION 钉成 -qgki-ged93b9ec66ee —— 这是**原厂 boot_a 里的真实 UTS_RELEASE**
#      （dump 自设备分区，非构建产物）。厂商 dlkm 的 vermagic 写的是 gd2a1055adeb0，
#      看着矛盾，但原厂自己也这样：CONFIG_MODVERSIONS 让 same_magic() 从串尾比较，
#      实际等于跳过 vermagic 校验（原厂 kernel ged93b9ec66ee + 模块 gd2a1055adeb0 正常开机
#      就是证据）。检测软件会解析 /proc/version 的 release，所以要对齐原厂。
#   4. 工作树 dirty 时 setlocalversion 会加 "+"，必须去掉。
#   5. 只开 Droidspaces 官方 GKI 清单里的项。CFS_BANDWIDTH / CGROUP_PIDS 不能开。
#   6. 产物跑一遍厂商模块 CRC 校验，不匹配就别刷。

# 失败时把 build.log 推到 ci-logs 分支：Actions 的日志/产物下载都要仓库权限，
# 而分支是匿名的，这样本机随时能拉到完整编译日志定位问题。
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main, master, sukisu-stage-a, sukisu-stage-b]
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'patches/**'
      - 'config/**'
      - 'checks/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    env:
      KERNEL_REPO: https://github.com/OnePlusOSS/android_kernel_oneplus_sm8350.git
      KERNEL_BRANCH: oneplus/sm8350_u_14.0.0_oneplus9
      KERNEL_SHA: 9e38a9fabb4de096bf386b7be988b7f7c5e4c58e
      VENDOR_REPO: https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8350.git
      VENDOR_SHA: d95833d6520887112ffed6537bfbef5e28650ca1
      KDIR: src/kernel/msm-5.4
      TARGET_VERMAGIC: "-qgki-ged93b9ec66ee"
      # SukiSU-Ultra v4.3.0 + 一加9 (5.4 非 GKI) 兼容移植，钉死 commit 保证可复现。
      # 上游 SukiSU-Ultra 只面向 GKI 2.0(5.10+)，这个移植补了 5.4 缺的
      # struct selinux_policy / copy_*_user_nofault / pmd_leaf / seccomp action_cache。
      SUKISU_REPO: https://github.com/LingQingMC/OnePlus9_ColorOS_SukiSU_Kernel.git
      SUKISU_SHA: f3c8c525275b5ec08cd95f60c1ec9c897b78fec9

    steps:
      - uses: actions/checkout@v4

      # 内核 LTO 构建吃磁盘，先腾出 20G+
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            python3 zip unzip cpio kmod device-tree-compiler curl git \
            libncurses5 libtinfo5 || \
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            python3 zip unzip cpio kmod device-tree-compiler curl git

      - name: Fetch kernel + vendor source
        run: |
          set -e
          mkdir -p src/kernel
          echo "=== 内核仓库 ==="
          git init -q "$KDIR"
          git -C "$KDIR" remote add origin "$KERNEL_REPO"
          git -C "$KDIR" fetch -q --depth=1 origin "$KERNEL_SHA"
          git -C "$KDIR" checkout -q FETCH_HEAD
          echo "kernel: $(git -C "$KDIR" log --oneline -1)"
          head -4 "$KDIR/Makefile"
          grep -q 'SUBLEVEL = 254' "$KDIR/Makefile" || { echo "::error::内核不是 5.4.254"; exit 1; }

          echo "=== module/devicetree 仓库（只取 vendor/）==="
          git init -q src/vend
          git -C src/vend remote add origin "$VENDOR_REPO"
          git -C src/vend fetch -q --depth=1 origin "$VENDOR_SHA"
          git -C src/vend checkout -q FETCH_HEAD
          echo "vendor: $(git -C src/vend log --oneline -1)"
          mv src/vend/vendor src/vendor
          # techpack/{audio,camera,display,dataipa,video} 在内核仓库里是 git 子模块
          # （mode 160000，克隆后为空目录），内容放在这个仓库的 kernel/msm-5.4 下，
          # 必须叠加到内核目录上，否则报 techpack/audio/Makefile 不存在。
          cp -a src/vend/kernel/msm-5.4/. "$KDIR/"
          rm -rf src/vend

          echo "=== 校验断链是否已解决 ==="
          for p in kernel/sched_assist/Kconfig \
                   include/linux/sched_assist \
                   drivers/soc/oplus/midas \
                   mm/task_mem \
                   net/oplus_modules \
                   techpack/audio/Makefile \
                   techpack/display/Makefile; do
            if [ -e "$KDIR/$p" ]; then
              echo "  ok   $p"
            else
              echo "::error::$p 仍然解析不到，vendor 树不完整"; exit 1
            fi
          done
          du -sh src/kernel/msm-5.4 src/vendor

      # 工作树 dirty，去掉 version 尾巴上的 "+"
      - name: Neutralise setlocalversion "+"
        run: |
          sed -i 's|res="$res${scm:++}"|res="$res"|' "$KDIR/scripts/setlocalversion"
          grep -n 'res="\$res' "$KDIR/scripts/setlocalversion" | head -3

      # OPPO 源码里存在 #include <../sched/sched.h> 这种尖括号相对路径，
      # 它依赖原厂私有构建里的 -I 搜索路径，公开树里 clang 直接报
      # "file not found with <angled> include; use quotes instead"。
      # 改成引号形式后按包含文件所在目录解析，语义与原意相同。
      - name: Normalise angled relative includes
        run: |
          set -e
          changed=0
          while IFS= read -r f; do
            sed -i -E 's@^([[:space:]]*#[[:space:]]*include[[:space:]]*)<((\.\./)+[^>]*)>@\1"\2"@' "$f"
            echo "  fixed: ${f#src/}"
            changed=$((changed+1))
          done < <(grep -rlE '^[[:space:]]*#[[:space:]]*include[[:space:]]*<(\.\./)+' \
                     --include='*.c' --include='*.h' --include='*.S' "$KDIR" src/vendor || true)
          echo "共修复 $changed 个文件"
          # 确认 rwsem.c 这个已知触发点已经改好
          grep -n 'sched/sched.h' "$KDIR/kernel/locking/rwsem.c" | head -3

          # OPPO / 高通的 trace 头用老写法 TRACE_INCLUDE_PATH . + #include <xxx_trace.h>，
          # 要求把「当前子目录」加进搜索路径（原厂私有构建里有，公开树没有）。
          # 给每个子目录加它自己的 -I，而不是全局平铺 —— 否则同名的 trace.h
          # 会互相抢匹配（arch/arm/kvm/trace.h 曾抢掉 kernel/sched/walt/trace.h）。
          echo 'KBUILD_CFLAGS += -I$(srctree)/$(src)' >> "$KDIR/scripts/Makefile.lib"
          tail -3 "$KDIR/scripts/Makefile.lib"

      - name: Fetch AOSP clang (clang 11.0.2 / r383902b)
        run: |
          mkdir -p "$HOME/clang"
          BASE="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive"
          # AOSP 会从 main 分支清掉老版本预编译包，r383902b(2020) 已不在 main 上，
          # 因此优先用不可变的 tag 快照。
          urls="
          $BASE/refs/tags/android-11.0.0_r48/clang-r383902b.tar.gz
          $BASE/refs/tags/android-11.0.0_r46/clang-r383902b.tar.gz
          $BASE/refs/tags/android-11.0.0_r39/clang-r383902b.tar.gz
          $BASE/refs/tags/android-11.0.0_r48/clang-r383902.tar.gz
          $BASE/refs/tags/android-12.0.0_r1/clang-r383902b.tar.gz
          $BASE/refs/heads/main/clang-r383902b.tar.gz
          "
          ok=0
          for url in $urls; do
            rm -f /tmp/clang.tar.gz /tmp/curlerr
            code=$(curl -sSL -S --max-time 900 -o /tmp/clang.tar.gz -w '%{http_code}' "$url" 2>/tmp/curlerr || true)
            size=$(wc -c < /tmp/clang.tar.gz 2>/dev/null || echo 0)
            echo "  http=$code size=${size}B  $url"
            [ -s /tmp/curlerr ] && echo "    curl: $(head -1 /tmp/curlerr)"
            if [ "$code" = "200" ] && [ "$size" -gt 20000000 ]; then
              if tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"; then ok=1; echo "  -> 解压完成"; break; fi
            fi
          done
          [ "$ok" = "1" ] || { echo "::error::clang 预编译包下载失败"; exit 1; }
          "$HOME/clang/bin/clang" --version
          "$HOME/clang/bin/clang" --version | grep -q 'version 11\.0\.2' \
            || echo "::warning::clang 不是 11.0.2，CFI 类型哈希可能与厂商模块不一致"
          ls "$HOME/clang/bin" | grep -E '^(clang|ld\.lld|llvm-nm|llvm-objcopy|llvm-strip)$' || true

      - name: Apply Droidspaces kABI patches
        run: |
          patch -d "$KDIR" -p1 --fuzz=3 --verbose < patches/droidspaces-5.4-kabi.patch

      # ---- SukiSU-Ultra 集成（非 GKI 5.4 移植）----
      # 只取最小改动，不照抄参考仓库那两个"整文件覆盖"的补丁：
      #   a) drivers/Makefile + drivers/Kconfig：追加编译入口（各 2 行）
      #   b) fs/namespace.c 末尾追加 path_umount：5.4 没有这个函数，
      #      App Profile 的「按 App 卸载模块」在 <5.10 必须靠它（官方文档明确要求回移），
      #      SUSFS 的 sus_mount 也依赖
      #   c) security/selinux/ss/services.c：策略重载后重新注入 sepolicy，
      #      否则 u:r:ksu:s0 会在 reload 后失效，表现为"su 时好时坏"
      # 刻意不应用参考仓库的 kernel/module.c 补丁：那是把 CRC 校验放宽到直接放行。
      # 我们是靠原厂 config + 原厂 clang 11.0.2 把 CRC 做对的，放宽等于放弃那层保护。
      - name: Integrate SukiSU-Ultra (non-GKI 5.4 port)
        run: |
          set -euo pipefail
          SRC=src/sukisu-src
          rm -rf "$SRC" && mkdir -p "$SRC"
          git init -q "$SRC"
          git -C "$SRC" remote add origin "$SUKISU_REPO"
          git -C "$SRC" fetch -q --depth=1 origin "$SUKISU_SHA"
          git -C "$SRC" checkout -q FETCH_HEAD
          echo "SukiSU 源: $(git -C "$SRC" log --oneline -1)"

          # 参考仓库里残留的 *.bak2 / *.orig2 不进树
          find "$SRC/KernelSU" -name '*.bak*' -delete
          find "$SRC/KernelSU" -name '*.orig*' -delete

          cp -a "$SRC/KernelSU" "$KDIR/KernelSU"
          ln -sfn ../KernelSU/kernel "$KDIR/drivers/kernelsu"
          grep -q 'obj-$(CONFIG_KSU)' "$KDIR/drivers/Makefile" \
            || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$KDIR/drivers/Makefile"
          grep -q 'drivers/kernelsu/Kconfig' "$KDIR/drivers/Kconfig" \
            || printf '\nsource "drivers/kernelsu/Kconfig"\n' >> "$KDIR/drivers/Kconfig"

          # 5.4 没有 linux/pgtable.h（5.8 才从 asm/pgtable.h 独立出来）
          [ -f "$KDIR/include/linux/pgtable.h" ] \
            || cp patches/include-linux-pgtable.h "$KDIR/include/linux/pgtable.h"

          # 上游 KernelSU 只针对 GKI 2.0(>=5.10)，用到几个 5.10+ 才拆出来的独立头：
          #   linux/minmax.h (5.10)、linux/hex.h (5.18)
          # 5.4 里这些东西都在 linux/kernel.h，用薄封装头转发，不改 KSU 源码本体
          for h in minmax.h hex.h; do
            if [ ! -f "$KDIR/include/linux/$h" ]; then
              cp "patches/compat/$h" "$KDIR/include/linux/$h"
              echo "compat header: include/linux/$h"
            fi
          done

          # 这棵树用 scripts/gcc-wrapper.py 把一切 warning 当 error（白名单机制）。
          # KSU 的 selinux/rules_54.c include xfrm.h 时，原型里 struct common_audit_data
          # 只是不完整类型前向声明（指针原型，不参与代码生成），clang 会打
          # [-Wvisibility] → "error, forbidden warning: xfrm.h:62"。按这棵树自身的
          # 设计意图，把这一条加进白名单，其余 warning 依然严格拦截。
          sed -i '/^allowed_warnings = set(\[/a\    "xfrm.h:62",' "$KDIR/scripts/gcc-wrapper.py" \
            && grep -n 'xfrm.h:62' "$KDIR/scripts/gcc-wrapper.py"

          # 但白名单是精确匹配 "文件:行号"，xfrm.h 里 62/68 两处静态内联原型
          # 都用了 struct common_audit_data（定义在 linux/lsm_audit.h），
          # rules_54.c 没先包含它 → 逐行报 -Wvisibility，堵不完。
          # 从根上消除：在 rules_54.c 的 include 块最前面补上定义该结构体的头。
          # 插在 linux/version.h 之前（而不是文件第 1 行），避免挡住 SPDX 标识。
          R54="$KDIR/drivers/kernelsu/selinux/rules_54.c"
          if ! grep -q 'linux/lsm_audit.h' "$R54"; then
            sed -i 's|^#include <linux/version.h>|#include <linux/lsm_audit.h>\n#include <linux/version.h>|' "$R54"
            sed -n '23,26p' "$R54"
          fi

          # path_umount 留到 stage-b 的 SUSFS 补丁之后再追加：
          # SUSFS 的 namespace.c 最后一个 hunk 就在文件末尾，先追加会改动它的上下文。

          patch -d "$KDIR" -p1 --fuzz=3 --verbose < patches/sukisu-selinux-reload.patch

          # mount_hide 在本树（一加9 / 5.4 非 GKI + CONFIG_CFI_CLANG）上的真实卡点：
          #   p->show 存的是 show_xxx 的 .cfi_jt 跳板地址，而 kallsyms 解析出的是
          #   函数本体（还带 $hash 后缀），上游 `if (p->show != expected)` 恒真，
          #   于是三个钩子全装上了却一次都没过滤过。
          # 反汇编核实过（run38 镜像）：m_show 调用 p->show 处是 blr x8、
          #   前面没有 ldr [x8,#-4]；wrapper 只 tail-call；ksu_filter_show 是 __nocfi。
          #   整条链上没有 typeid 比对，所以直接替换安全，无需自证 kCFI。
          python3 patches/compat/patch_mount_hide.py "$KDIR/KernelSU/kernel/feature/mount_hide.c"
          # 判据用新逻辑独有的标识符，别用日志文案（文案一改动就误判失败）
          grep -q 'swap show' "$KDIR/KernelSU/kernel/feature/mount_hide.c" \
            || { echo "::error::mount_hide 补丁没打上，模块挂载会对 app 全裸"; exit 1; }
          grep -q 'typeid 都不匹配' "$KDIR/KernelSU/kernel/feature/mount_hide.c" \
            && { echo "::error::源码里还残留旧版 kCFI 自检，补丁没生效"; exit 1; }
          # 容器挂载 marker：缺了它，/data/local/daidai 的 13 个挂载点会变成孤儿，
          # 春秋报「挂载间隙」。
          grep -q '"daidai"' "$KDIR/KernelSU/kernel/feature/mount_hide.c" \
            || { echo "::error::markers 没扩充，容器挂载会漏过滤"; exit 1; }
          echo "mount_hide 补丁已注入"

          # 非原厂 loop 的 backing_file 会原样写出容器与模块镜像的真实路径：
          #   /sys/block/loop42/loop/backing_file = /data/local/Droidspaces/Containers/ubuntu/rootfs.img
          #   /sys/block/loop41/loop/backing_file = /data/adb/modules/meta-overlayfs/modules.img
          # 春秋那条「loop42」就是这么被看见的（mount_hide 管不到 sysfs）。
          # sus_path 对 kernfs inode 不可靠（inode 会重建，标记半分钟失效），
          # 所以只在 show 输出这一层过滤：命中即返回 0 字节，等同“未绑定后备文件”。
          # 只改只读属性，不碰 LOOP_SET_FD/挂载逻辑，容器照常跑。
          python3 patches/compat/patch_loop_hide.py "$KDIR/drivers/block/loop.c"
          grep -q 'loop_path_should_hide' "$KDIR/drivers/block/loop.c" \
            || { echo "::error::loop backing_file 过滤没打上，容器路径会在 sysfs 裸奔"; exit 1; }
          grep -q 'loop_path_should_hide(p)' "$KDIR/drivers/block/loop.c" \
            || { echo "::error::helper 注入了但 show 里没调用，等于没过滤"; exit 1; }
          echo "loop backing_file 过滤已注入"

          # 春秋 4.6.3 的「检测SELinux Policy时发现可疑问题」不是读策略二进制，
          # 而是以应用身份调 selinuxfs 查询接口（kprobe 实测，nativecheck_zygote 子进程）：
          #   /sys/fs/selinux/access   写 "scon tcon tclass" 读回 avd.allowed 位图（72 次）→ 挡
          #   /sys/fs/selinux/context  把上下文字符串翻译成 sid（88 次）→ 绝不能挡！
          #     （run44 实机教训：zygote specialize 每个 app 都经它 setcon，挡了整机黑屏）
          #   /sys/fs/selinux/class/*/perms/*  权限名 → 位索引
          # 再用 vendor_sepolicy.cil 建静态模型，于是还原出
          #   "untrusted_app -> ksu_file read"（源自 rules_54.c 的 allow domain ksu_file ALL）
          # 和 "access seqno"（access 接口返回的 avd.seqno 字段）。
          # 挡法：uid >= 10000 一律 -EACCES；root/system/shell 不受影响，
          # 也不动代码段、不克隆 policydb（upstream selinux_hide.c 那套要 5.5 API）。
          python3 patches/compat/patch_selinuxfs_access.py "$KDIR/security/selinux/selinuxfs.c"
          grep -q 'SECFS_APP_GUARD' "$KDIR/security/selinux/selinuxfs.c" \
            || { echo "::error::selinuxfs 的 app uid 守卫没注入，春秋仍可枚举 ksu 规则"; exit 1; }
          # 必须三处都在：access / context / policy，少一处它就有别的通道绕过去
          test "$(grep -c 'SECFS_APP_GUARD' "$KDIR/security/selinux/selinuxfs.c")" -ge 2 \
            || { echo "::error::selinuxfs 守卫数量不足（access + policy 应各一处；context 必须放行）"; exit 1; }
          echo "selinuxfs app uid 守卫已注入（access + policy，context 放行）"

          # /proc/version 的编译器串不受任何 KBUILD_* 影响，只能改 mkcompile_h 写死。
          # 不改的话会暴露 CI 的 clang 快照号 + LLD 的 buildbot 临时目录（每次都变）。
          python3 patches/compat/patch_mkcompile_h.py "$KDIR/scripts/mkcompile_h"
          grep -q '6877366 based on r383902b1' "$KDIR/scripts/mkcompile_h" \
            || { echo "::error::mkcompile_h 补丁没打上"; exit 1; }
          sh -n "$KDIR/scripts/mkcompile_h" \
            || { echo "::error::mkcompile_h 打完补丁有语法错，会让整个编译挂掉"; exit 1; }
          echo "mkcompile_h 补丁已注入"

          # /proc/sys/kernel/tainted 原厂是 0，我们这树注定带 O/W/S（见补丁注释）。
          python3 patches/compat/patch_taint.py "$KDIR/kernel/panic.c"
          grep -q '伪装原厂' "$KDIR/kernel/panic.c" \
            || { echo "::error::taint 补丁没打上，/proc/sys/kernel/tainted 会是 4612"; exit 1; }
          echo "taint 补丁已注入"

          test -f "$KDIR/drivers/kernelsu/Kbuild" || { echo "::error::KSU 源码没就位"; exit 1; }
          grep -q 'kernelsu-objs' "$KDIR/drivers/kernelsu/Kbuild" || { echo "::error::KSU Kbuild 异常"; exit 1; }
          echo "KSU 源文件数: $(find "$KDIR/KernelSU/kernel" -name '*.c' | wc -l)"
          grep -n 'CONFIG_KSU' "$KDIR/drivers/Makefile" "$KDIR/drivers/Kconfig"

      # ---- stage-b：SUSFS 2.3.0（非 GKI 5.4 回移）----
      # 补丁来自 kafuuchino-s/susfs4ksu 的 mix4-5.4 分支（2.3.0 回移），已 vendor 进仓库。
      # 它按 KSU「manual hook」写的：fs/*.c 里会调 ksu_handle_execveat/faccessat/stat…
      # SukiSU 走 tracepoint hook，符号名是 xxx_sucompat，所以打完补丁后要
      # 用 patches/compat/odin_ksu_hooks.h（空实现）覆盖补丁自带的那份头，
      # 否则链接期 undefined reference。这些 hook 属于 KSU 自己的 su 兼容，
      # 与 SUSFS 的隐藏能力无关。
      - name: Apply SUSFS 2.3.0 (non-GKI 5.4 backport)
        run: |
          set -euo pipefail

          # SukiSU 的 Kconfig 里没有 KSU_SUSFS 这个开关（susfs.Kconfig 依赖它），补一个
          if ! grep -q '^config KSU_SUSFS$' "$KDIR/KernelSU/kernel/Kconfig"; then
            printf '\nconfig KSU_SUSFS\n\tbool "Enable SUSFS support"\n\tdepends on KSU\n\tdefault n\n\thelp\n\t  Gate for SuSFS. Implementation comes from the non-GKI 5.4\n\t  backport patch; this switch only exposes it to Kconfig.\n' >> "$KDIR/KernelSU/kernel/Kconfig"
          fi
          grep -n -A3 '^config KSU_SUSFS$' "$KDIR/KernelSU/kernel/Kconfig"

          if ! patch -d "$KDIR" -p1 --fuzz=3 --verbose < patches/susfs-2.3.0-5.4.patch > /tmp/susfs-patch.log 2>&1; then
            echo "::error::SUSFS 补丁没打干净"
            grep -E 'FAILED|Hunk|Reversed|reject' /tmp/susfs-patch.log | head -30 || true
            msg=$(grep -E 'FAILED|Hunk' /tmp/susfs-patch.log | head -12 | sed -e 's/%/%25/g' | awk 'NR>1{printf "%%0A"} {printf "%s", $0}')
            echo "::error::SUSFS_HUNKS::$msg"
            exit 1
          fi
          echo "打上的文件数: $(grep -cE '^patching file' /tmp/susfs-patch.log)"

          # 落点审计：sus_path 的钩子全在 fs/namei.c 里，必须确认它真的写进去了
          echo "=== namei/stat 相关 hunk 的落点（offset 为正说明上下文有偏移）==="
          grep -E 'patching file fs/(namei|stat|open|readdir)\.c|Hunk #[0-9]+ (succeeded|FAILED)' \
            /tmp/susfs-patch.log | head -40 || true
          echo "=== fs/namei.c 里 susfs_is_inode_sus_path 的调用行 ==="
          grep -n 'susfs_is_inode_sus_path' "$KDIR/fs/namei.c" || echo "!! namei.c 里一个都没有"
          echo "=== lookup_last 实际内容 ==="
          awk '/static inline int lookup_last\(struct nameidata \*nd\)/,/^}/' "$KDIR/fs/namei.c" | head -16
          echo "=== link_path_walk_inode 循环开头的钩子 ==="
          grep -n -A5 'struct dentry \*dentry = nd->path.dentry;' "$KDIR/fs/namei.c" | head -20
          echo "=== ND_ 宏在 susfs_def.h 的取值 ==="
          grep -n 'define ND_STATE_LOOKUP_LAST\|define ND_STATE_OPEN_LAST\|define ND_FLAGS_LOOKUP_LAST' "$KDIR/include/linux/susfs_def.h"

          # ---- 把补丁里 KSU 侧的三处接线改成 SukiSU 的写法 ----
          # 1) 补丁写的是 ReSukiSU 那套：ksu_su_compat_enabled 是 static_key_true。
          #    SukiSU 里它是普通 bool（feature/sucompat.c），类型不符直接编不过，
          #    所以连声明带 static_branch_likely() 一起换成 bool 直读。
          for f in fs/exec.c fs/open.c fs/stat.c; do
            sed -i \
              -e 's|extern struct static_key_true ksu_su_compat_enabled;|extern bool ksu_su_compat_enabled;|' \
              -e 's|static_branch_likely(&ksu_su_compat_enabled)|ksu_su_compat_enabled|g' \
              "$KDIR/$f"
          done
          # 2) drivers/input/input.c 用的是 ksu_is_input_hook_enabled 静态键，
          #    SukiSU 根本没有这个符号 → 整个 if 去掉，调用点由垫片宏抹平。
          sed -i \
            -e '/extern struct static_key_true ksu_is_input_hook_enabled;/d' \
            -e '/if (static_branch_unlikely(&ksu_is_input_hook_enabled))/d' \
            "$KDIR/drivers/input/input.c"

          # 3) 换掉补丁自带的 manual-hook 头（里面有会撞签名的 extern 声明），
          #    改用 patches/compat/odin_ksu_hooks.h 的宏版本
          cp patches/compat/odin_ksu_hooks.h "$KDIR/include/linux/odin_ksu_hooks.h"

          # 3b) sus_path 的前置门改成只看 uid
          #   原式: test_thread_flag(TIF_PROC_UMOUNTED) && current_uid() >= 10000
          #   flag 由原 fork 的 __sys_setresuid hook 打，而 SukiSU 的 su 走 setuid(2)
          #   → __sys_setuid 是独立函数，不经过 __sys_setresuid，flag 永远打不上，
          #   于是每个进程都被判「不是 app 进程」，add-sus-path 全部静默空转
          #   （实测：dmesg 里 flag 置位成功、命令 ret 0，但 app 侧照样看得见）。
          #   app 判定本身就是 current_uid() >= 10000，去掉 flag 条件是等价的且不依赖 KSU 侧。
          python3 -c 'import sys; p=sys.argv[1]; s=open(p).read(); n=s.replace("return (likely(test_thread_flag(TIF_PROC_UMOUNTED)) &&","return ("); assert n!=s, "门没替换成功"; open(p,"w").write(n)' "$KDIR/include/linux/susfs_def.h"
          grep -A3 'bool susfs_is_current_proc_umounted_app(void)' "$KDIR/include/linux/susfs_def.h"
          grep -q 'test_thread_flag(TIF_PROC_UMOUNTED)) &&' "$KDIR/include/linux/susfs_def.h" \
            && { echo "::error::sus_path 的门还依赖 TIF_PROC_UMOUNTED"; exit 1; } || true

          # path_umount 现在补：SUSFS 补丁已经把 namespace.c 改完，追加不会打架
          if ! grep -q 'KernelSU / SukiSU support for non-GKI kernels' "$KDIR/fs/namespace.c"; then
            cat patches/sukisu-path_umount.c >> "$KDIR/fs/namespace.c"
          fi

          # 补丁假定 KSU 侧提供 susfs_ksu_sid / susfs_is_current_ksu_domain(),
          # SukiSU 没有 → 追加等价实现到 fs/susfs.c 末尾（见该文件注释）
          if ! grep -q 'susfs_is_current_ksu_domain(void)$' "$KDIR/fs/susfs.c"; then
            cat patches/compat/susfs_ksu_domain.c >> "$KDIR/fs/susfs.c"
          fi
          grep -q '^u32 susfs_ksu_sid;' "$KDIR/fs/susfs.c" || { echo "::error::susfs_ksu_sid 没补上"; exit 1; }

          # ---- 接线自检：任何一处没改成功，后面都要白编 40 分钟 ----
          bad=0
          if grep -rq 'static_branch_likely(&ksu_su_compat_enabled)' "$KDIR/fs"; then
            echo "::error::ksu_su_compat_enabled 的 static_branch 没替换干净"; bad=1
          fi
          if grep -rq 'struct static_key_true ksu_su_compat_enabled' "$KDIR/fs"; then
            echo "::error::ksu_su_compat_enabled 类型没改成 bool"; bad=1
          fi
          if grep -q 'ksu_is_input_hook_enabled' "$KDIR/drivers/input/input.c"; then
            echo "::error::input.c 的静态键没清掉"; bad=1
          fi
          if ! grep -q 'ksu_handle_' "$KDIR/include/linux/odin_ksu_hooks.h"; then
            echo "::error::垫片头丢了"; bad=1
          fi
          [ $bad -eq 0 ] || exit 1
          echo "接线自检通过"
          grep -n 'ksu_su_compat_enabled' "$KDIR/fs/open.c" | head -4

          # 落点自检
          test -f "$KDIR/fs/susfs.c"                      || { echo "::error::fs/susfs.c 没落盘"; exit 1; }
          test -f "$KDIR/include/linux/susfs.h"           || { echo "::error::include/linux/susfs.h 没落盘"; exit 1; }
          grep -q 'susfs.o' "$KDIR/fs/Makefile"           || { echo "::error::fs/Makefile 没加 susfs.o"; exit 1; }
          grep -q 'susfs.Kconfig' "$KDIR/fs/Kconfig"      || { echo "::error::fs/Kconfig 没 source susfs.Kconfig"; exit 1; }
          grep -m1 'SUSFS_VERSION' "$KDIR/include/linux/susfs.h"

          # 控制面自检：ksud 的每条 susfs 命令都走 reboot(0xDEADBEEF,0xFAFAFAFA,cmd,&payload)，
          # 分发点就在这个头里的 ksu_handle_sys_reboot。若它被写回空宏 (-EINVAL)，
          # 内核照样编得过、SUSFS 代码照样在，但 ksud 的每条命令都会被静默吞掉
          # （RC=0、uname 不变、implementation=unsupported）—— 上一版就栽在这。
          grep -q 'static inline int ksu_handle_sys_reboot' "$KDIR/include/linux/odin_ksu_hooks.h" \
            || { echo "::error::odin_ksu_hooks.h 里的 sys_reboot 分发又退化成空宏了"; exit 1; }
          for fn in susfs_add_sus_path susfs_set_uname susfs_add_sus_kstat \
                    susfs_set_cmdline_or_bootconfig susfs_get_enabled_features; do
            grep -q "$fn(arg)" "$KDIR/include/linux/odin_ksu_hooks.h" \
              || { echo "::error::控制面缺少 $fn 的分发"; exit 1; }
          done
          # susfs_init 必须有人调，否则 susfs_extra_works / sdcard_cleanup_dwork 是未初始化对象
          grep -q 'late_initcall(fs_compat_late_init)' "$KDIR/fs/susfs.c" \
            || { echo "::error::susfs_init 没被调用，workqueue 结构未初始化"; exit 1; }
          # sus_path 的开关：setresuid hook 必须真的打 TIF_PROC_UMOUNTED，
          # 否则 susfs_is_current_proc_umounted_app() 恒 false，add-sus-path 全部空转
          grep -q 'set_thread_flag(TIF_PROC_UMOUNTED)' "$KDIR/include/linux/odin_ksu_hooks.h" \
            || { echo "::error::setresuid hook 又被抹成空宏了，sus_path 会全线失效"; exit 1; }
          echo "控制面自检通过：$(grep -c 'susfs_.*(arg)' "$KDIR/include/linux/odin_ksu_hooks.h") 个命令已接线"

          # 探点已撤（2026-11-16）：sus_path 的真因不是内核逻辑，而是 flash_stagec.sh 的
          # push_once 只比文件大小 —— 所有 Image 都正好 44945920 字节，于是每次都「跳过传输」，
          # 一直在刷 00:37 那份旧内核。修正成 md5 比对后，带门修复的镜像一刷上，
          # sus_path 立刻生效（app uid 10318 看不到 /system/etc/hosts，root 正常）。
          # 探点留着只会污染 .rodata（曾把 uname 伪装串冲成 '5.4.254-qgki-gPROBE'），故删除。
          echo "susfs.c 行数: $(wc -l < "$KDIR/fs/susfs.c")"

      - name: Configure
        run: |
          set -eE
          trap 'rc=$?; echo "::error::Configure 第 $LINENO 行失败 rc=$rc: $BASH_COMMAND"' ERR
          export PATH="$HOME/clang/bin:$PATH"
          cp config/device-stock.config "$KDIR/.config"

          # vermagic 逐字对齐原厂（值以 "-" 开头，交给 sed 处理更稳）
          sed -i 's|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION="'"$TARGET_VERMAGIC"'"|' "$KDIR/.config"
          sed -i 's|^CONFIG_LOCALVERSION_AUTO=.*|# CONFIG_LOCALVERSION_AUTO is not set|' "$KDIR/.config"
          grep -E '^CONFIG_LOCALVERSION' "$KDIR/.config" | tee /dev/stderr | grep -q 'ged93b9ec66ee' \
            || { echo "::error::LOCALVERSION 没写对"; exit 1; }

          # 叠加 Droidspaces 配置
          cat config/droidspaces.config >> "$KDIR/.config"
          # 叠加 SukiSU 配置（CONFIG_KSU）
          cat config/sukisu.config >> "$KDIR/.config"
          # 叠加 SUSFS 配置（stage-b）
          cat config/susfs.config >> "$KDIR/.config"

          make -C "$KDIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" olddefconfig 2>&1 | tee olddefconfig.log
          echo "=== kconfig 告警/错误 ==="
          grep -iE "warning|error|recursive" olddefconfig.log | head -30 || echo "  (none)"

          echo "=== 关键配置复查（依据 Droidspaces 官方 GKI 清单）==="
          # 缺任意一项：容器直接起不来 / 硬件不可用 —— 硬失败
          # olddefconfig 会静默丢弃依赖不满足的项，所以必须逐条 grep 验证
          fatal="CFI_CLANG NAMESPACES PID_NS UTS_NS IPC_NS SYSVIPC POSIX_MQUEUE DEVTMPFS SECCOMP SECCOMP_FILTER CGROUPS MEMCG"
          for sym in $fatal; do
            if grep -q "^CONFIG_${sym}=y" "$KDIR/.config"; then
              printf "  ok    CONFIG_%s=y\n" "$sym"
            else
              echo "::error::CONFIG_${sym} 没开，容器会起不来"; exit 1
            fi
          done

          # 这两项开了会破坏 kABI，原厂模块全部拒载 —— 必须确认是关的
          for sym in CFS_BANDWIDTH CGROUP_PIDS; do
            if grep -q "^CONFIG_${sym}=y" "$KDIR/.config"; then
              echo "::error::CONFIG_${sym} 被打开了，会破坏 kABI"; exit 1
            fi
          done

          # 推荐项：缺了功能打折，但不影响启动
          for sym in USER_NS NETFILTER_XT_MATCH_ADDRTYPE IP6_NF_NAT MACVLAN TMPFS_XATTR \
                     BLK_DEV_LOOP EXT4_FS OVERLAY_FS FUSE_FS TUN VETH BRIDGE NET_NS; do
            grep -q "^CONFIG_${sym}=y" "$KDIR/.config" || echo "::warning::CONFIG_${sym} 未开启（功能受限）"
          done

          grep -E '^CONFIG_LOCALVERSION' "$KDIR/.config"
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set' "$KDIR/.config" \
            || { echo "::error::LOCALVERSION_AUTO 没关掉，vermagic 会带脏尾"; exit 1; }

          # 原厂功能对齐：源码把 OPPO_* 改名成 OPLUS_*，不显式开就会静默丢掉
          # 指纹是硬失败项：COMMON 不开 -> 链接期 opticalfp_irq_handler_register
          # 未定义；GOODIX/QCOM 不开 -> /dev/goodix_fp 不存在，HAL 起来就退出 255
          for sym in OPLUS_FINGERPRINT OPLUS_FINGERPRINT_COMMON OPLUS_FINGERPRINT_QCOM \
                     OPLUS_FINGERPRINT_GOODIX_OPTICAL OPLUS_FINGERPRINT_JIIOV_OPTICAL; do
            if grep -q "^CONFIG_${sym}=y" "$KDIR/.config"; then
              printf "  ok    CONFIG_%s=y\n" "$sym"
            else
              echo "::error::CONFIG_${sym} 被 olddefconfig 丢掉了，指纹会失效"
              echo "::warning::diag SPI: $(grep -E '^CONFIG_SPI(_MASTER)?=' "$KDIR/.config" | tr '\n' ' ')"
              echo "::warning::diag OPLUS: $(grep -c '^CONFIG_OPLUS' "$KDIR/.config") 项, 指纹 Kconfig 引用: $(grep -c 'oplus_fp_drivers' "$KDIR/drivers/input/Kconfig" 2>/dev/null || echo NA)"
              echo "::warning::diag Kconfig尾: $(tail -3 "$KDIR/drivers/Kconfig" | tr '\n' '|')"
              echo "::warning::diag FINGERPRINT行: $(grep -n 'FINGERPRINT' "$KDIR/.config" | head -4 | tr '\n' '|' | cut -c1-260)"
              echo "::warning::diag inputKconfig: $(grep -n 'oplus_fp_drivers' "$KDIR/drivers/input/Kconfig" | head -2 | tr '\n' '|') / INPUT=$(grep -E '^CONFIG_INPUT=' "$KDIR/.config")"
              echo "::warning::diag olddefconfig: $(grep -iE 'warning|error' olddefconfig.log | head -3 | tr '\n' '|' | cut -c1-260)"
            fi
          done
          for sym in OPLUS_FEATURE_SCHED_ASSIST DEVTMPFS_MOUNT; do
            grep -q "^CONFIG_${sym}=y" "$KDIR/.config" \
              && printf "  ok    CONFIG_%s=y\n" "$sym" \
              || echo "::warning::CONFIG_${sym} 没开（原厂是开的，功能会缺失）"
          done
          echo "OPLUS 私有项数量: $(grep -c OPLUS "$KDIR/.config")"

          # KSU 是硬失败项：KSU 依赖 KPROBES + EXT4_FS，任一不满足 olddefconfig 会把它悄悄丢掉，
          # 编出来的内核看着正常、刷进去没有 root，最难排查。
          if grep -q '^CONFIG_KSU=y' "$KDIR/.config"; then
            printf "  ok    CONFIG_KSU=y\n"
          else
            echo "::error::CONFIG_KSU 被 olddefconfig 丢掉了（检查 KPROBES / EXT4_FS）"; exit 1
          fi
          for sym in KSU_MANUAL_SU; do
            grep -q "^CONFIG_${sym}=y" "$KDIR/.config" \
              && printf "  ok    CONFIG_%s=y\n" "$sym" \
              || echo "::warning::CONFIG_${sym} 没开，授权链会依赖管理器常驻"
          done
          grep -q '^# CONFIG_KPM is not set' "$KDIR/.config" \
            || echo "::warning::CONFIG_KPM 状态不是预期的关闭"

          # ---- stage-b：SUSFS 必须真的开进去了 ----
          # olddefconfig 对 depends 不满足的符号会静默丢弃，所以逐个 grep 验证。
          for sym in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                     KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                     KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT \
                     KSU_SUSFS_SUS_MAP; do
            if grep -q "^CONFIG_${sym}=y" "$KDIR/.config"; then
              printf "  ok    CONFIG_%s=y\n" "$sym"
            else
              echo "::error::CONFIG_${sym} 没开（SUSFS 的 depends 可能没满足：KSU / ARM64 / THREAD_INFO_IN_TASK）"
              grep -nE "CONFIG_${sym}" "$KDIR/.config" || true
              exit 1
            fi
          done

      # 不管 Configure 成败都导出关键现场（annotation 匿名可读，日志要仓库权限）
      - name: Dump config diagnostics
        if: always()
        run: |
          C="$KDIR/.config"
          [ -f "$C" ] || { echo "::warning::.config 不存在"; exit 0; }
          echo "::warning::d1 CONFIG总数=$(grep -c '^CONFIG_' "$C") KSU=$(grep -c '^CONFIG_KSU' "$C")"
          echo "::warning::d2 $(grep -n 'OPLUS_FINGERPRINT' "$C" | head -3 | tr '\n' '|' | cut -c1-300)"
          echo "::warning::d3 $(grep -E '^CONFIG_(SPI|SPI_MASTER|INPUT)=' "$C" | tr '\n' ' ')"
          echo "::warning::d4 kconf: $(grep -icE 'error' olddefconfig.log 2>/dev/null || echo NA) $(grep -iE 'error' olddefconfig.log 2>/dev/null | head -2 | tr '\n' '|' | cut -c1-260)"
          echo "::warning::d5 $(tail -3 olddefconfig.log 2>/dev/null | tr '\n' '|' | cut -c1-260)"

      - name: Build Image
        run: |
          set -euo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          # /proc/version 直接来自 linux_banner，SUSFS 只伪造 uname(2)，管不到它。
          # 默认会写成 "runner@runnervmy75tu ... clang ...（CI 构建机）"，
          # 检测软件一眼就能看出是自编译内核（春秋：Tampered kernel）。
          # 这里把编译者/主机/时间换成原厂风格（取自 slot-a 原厂 boot 的 banner）。
          export KBUILD_BUILD_USER=root
          export KBUILD_BUILD_HOST=kvm-slave-build-s-vendor-04319166
          export KBUILD_BUILD_TIMESTAMP="Tue Jan 21 00:36:33 CST 2025"
          echo "runner: $(nproc) cores / $(free -g | awk '/^Mem:/{print $2}') GB RAM"
          df -h / | tail -1
          make -C "$KDIR" -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" Image 2>&1 | tee build.log
          ls -l "$KDIR/arch/arm64/boot/Image"
          echo "=== 产物自检 ==="
          grep -m2 '__cfi_slowpath' "$KDIR/System.map" || { echo "::error::System.map 里没有 __cfi_slowpath，CFI 没编进去"; exit 1; }
          echo "=== KSU 符号自检 ==="
          grep -c -E ' (ksu|kernelsu)_' "$KDIR/System.map" || true
          grep -m5 -E ' (ksu_reapply_sepolicy_after_reload|ksu_supercall|kernelsu_init)$' "$KDIR/System.map" \
            || { echo "::error::System.map 里找不到 KSU 符号，KSU 没编进内核"; exit 1; }
          echo "=== SUSFS 符号自检 ==="
          grep -m6 -E ' (susfs_init|susfs_add_sus_path|susfs_set_uname|susfs_start_sdcard_monitor|susfs_add_sus_map|susfs_set_cmdline_or_bootconfig)$' "$KDIR/System.map" \
            || { echo "::error::System.map 里没有 susfs_* 符号，SUSFS 没编进去"; exit 1; }
          grep -c 'susfs' "$KDIR/System.map"
          if strings "$KDIR/arch/arm64/boot/Image" | grep -qE '5\.4\.254-qgki-g[a-f0-9]\+'; then
            echo "::error::内核版本串带了 + ，模块会全部拒载"; exit 1
          fi
          strings "$KDIR/arch/arm64/boot/Image" | grep -m2 'Linux version 5\.4\.254'
          echo "=== banner 伪装自检（应看到 root@kvm-slave-build-s-vendor-04319166）==="
          strings "$KDIR/arch/arm64/boot/Image" | grep -m1 -o 'Linux version 5\.4\.254[^)]*)' \
            || { echo "::error::Image 里找不到 Linux version 串"; exit 1; }
          strings "$KDIR/arch/arm64/boot/Image" | grep -q 'kvm-slave-build-s-vendor-04319166' \
            || { echo "::error::KBUILD_BUILD_HOST 没生效，/proc/version 会暴露 CI 构建机"; exit 1; }
          echo "=== mount_hide kCFI 自检（wrapper 必须有 __cfi_ 前缀，否则间接调用会 BUG）==="
          nm "$KDIR/vmlinux" | grep -E '__cfi_ksu_show_(vfsmnt|mountinfo|vfsstat)' | head -5 \
            || echo "::warning::没找到 __cfi_ksu_show_* —— 运行期 typeid 自检会拦住替换，只是不隐藏"
          echo "挂载 hook 符号: $(nm "$KDIR/vmlinux" | grep -c -E '__cfi_ksu_show_')"
          # Module.symvers 是下一步 CRC 校验的输入
          if [ ! -s "$KDIR/Module.symvers" ]; then
            echo "!! Module.symvers 缺失，补跑 modules"
            make -C "$KDIR" -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
              KCFLAGS="-D__ANDROID_COMMON_KERNEL__" modules 2>&1 | tail -20
          fi
          [ -s "$KDIR/Module.symvers" ] || { echo "::error::Module.symvers 生成失败"; exit 1; }
          echo "Module.symvers 行数: $(wc -l < "$KDIR/Module.symvers")"

      # 编译日志需要仓库权限才能下载，用 annotation 通道把关键错误带出来
      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || { echo "::error::没有 build.log，编译根本没开始"; exit 0; }
          echo "::error::build.log 行数: $(wc -l < build.log)"
          # 第一个 "Error N" 之前 25 行就是编译器真正的诊断，最值钱的一块
          firsterr=$(grep -nE 'Error [0-9]+' build.log | head -1 | cut -d: -f1 || true)
          if [ -n "${firsterr:-}" ]; then
            slice=$(sed -n "$((firsterr>25 ? firsterr-25 : 1)),$((firsterr+2))p" build.log | cut -c1-300)
            smsg=$(printf '%s' "$slice" | sed -e 's/%/%25/g' | awk 'NR>1{printf "%%0A"} {printf "%s", $0}')
            echo "::error::FIRST_ERROR_SLICE::$smsg"
          fi
          # GitHub 每个 step 只保留 10 条 annotation，所以把内容压进 2 条长消息里；
          # 换行用 %0A 编码，% 本身必须先转成 %25，否则日志里的 %xx 会被当成控制符。
          hits=$(grep -nE -A2 "error:|fatal error|undefined reference|No rule to make|Error [0-9]|Killed" build.log \
                 | sed -E 's#^([0-9]+)[-:].*/(src/kernel/[^:]+):#\1 \2:#' \
                 | tail -40 | cut -c1-320 || true)
          msg=$(printf '%s' "$hits" | sed -e 's/%/%25/g' | awk 'NR>1{printf "%%0A"} {printf "%s", $0}')
          echo "::error::ERR_HITS::$msg"
          tailmsg=$(tail -18 build.log | cut -c1-320 | sed -e 's/%/%25/g' | awk 'NR>1{printf "%%0A"} {printf "%s", $0}')
          echo "::error::TAIL::$tailmsg"

      # 关键一步：拿新内核的 Module.symvers 跟手机里 99 个厂商模块要求的 CRC 对一遍
      #
      # 必须带上 stock-vmlinux-exports.json：模块的依赖分两类来源，
      #   a) vmlinux 导出 -> 由我们重编的内核提供，必须逐个校验 CRC；
      #   b) 另一个 .ko 导出（q6_dlkm 导出 adm_*、swr_dlkm 导出 __devm_regmap_init_swr ...）
      #      -> 那些 .ko 都是原厂原件不动，互相之间天然自洽。
      # `make Image` 的 Module.symvers 只含 vmlinux 导出，不区分就会把 (b) 类误报成失败。
      - name: Verify vendor module CRCs
        id: crc
        continue-on-error: true
        run: |
          set -euo pipefail
          gunzip -c checks/vendor-crc-baseline.json.gz > /tmp/baseline.json
          gunzip -c checks/stock-vmlinux-exports.json.gz > /tmp/vmlinux-exports.json
          ls -l "$KDIR/Module.symvers"
          python3 checks/check_vendor_crc.py verify /tmp/baseline.json "$KDIR/Module.symvers" /tmp/vmlinux-exports.json | tee crc-report.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus9-droidspaces-${{ github.run_number }}
          path: |
            src/kernel/msm-5.4/arch/arm64/boot/Image
            src/kernel/msm-5.4/Module.symvers
            src/kernel/msm-5.4/.config
            src/kernel/msm-5.4/System.map
            build.log
            olddefconfig.log
            crc-report.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      # 日志/产物走 API 下载都要仓库权限（403 / 401），但分支是公开可拉的。
      # 编译失败时把 build.log 单独推到一个孤儿分支，本机 git fetch 就能拿到全量日志。
      - name: Publish build log to ci-logs branch
        if: failure()
        continue-on-error: true
        run: |
          [ -f build.log ] || { echo "没有 build.log，跳过"; exit 0; }
          work="$RUNNER_TEMP/ci-log-repo"
          rm -rf "$work" && mkdir -p "$work"
          cp build.log "$work/"
          cd "$work"
          git init -q
          git checkout -q -b ci-logs
          git -c user.name=ci-bot -c user.email=ci-bot@users.noreply.github.com add build.log
          git -c user.name=ci-bot -c user.email=ci-bot@users.noreply.github.com commit -qm "build.log · run ${{ github.run_number }} · ${GITHUB_SHA:0:7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
          echo "已推送 ci-logs 分支: $(git rev-parse --short HEAD)"

      - name: Gate
        if: steps.crc.outcome == 'failure'
        run: |
          echo "::error::厂商模块 CRC 不匹配，这个内核刷进去会起不来，不要下载使用"
          exit 1
