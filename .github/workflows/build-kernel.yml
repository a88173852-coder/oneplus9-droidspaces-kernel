name: build-oneplus9-droidspaces

# 一加9 (LE2110 / ColorOS 14 / 5.4.254-qgki) · Droidspaces 内核云编译
#
# 目标：产出一个只带 Droidspaces 所需命名空间/IPC 能力、其余完全保持原厂配置的
#       arch/arm64/boot/Image，然后用 magiskboot 替换进原厂 boot_b.img 刷入。
#
# 几个必须守住的点（都是别人踩过的坑）：
#   1. 编译器必须用 AOSP clang r383902（= clang 11.0.2），与原厂内核一致。
#      换版本会改变 CFI 插桩 ABI，厂商模块里的 __cfi_slowpath 调用会对不上。
#   2. CONFIG_CFI_CLANG / LTO / SCS 必须保持开启，olddefconfig 后要复查。
#   3. LOCALVERSION 必须钉成 -qgki-gd2a1055adeb0，与厂商模块 vermagic 逐字一致，
#      否则 insmod 直接 "version magic ... should be ..."。
#   4. 工作树是 dirty 的，setlocalversion 会加 "+"，必须去掉。
#   5. 只开 Droidspaces GKI 清单里的配置项。CFS_BANDWIDTH / CGROUP_PIDS 不能开。
#   6. 产物直接跑一遍厂商模块 CRC 校验，不匹配就别刷。

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'patches/**'
      - 'config/**'
      - 'checks/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      KERNEL_REPO: https://github.com/OnePlusOSS/android_kernel_oneplus_sm8350.git
      KERNEL_SHA: 9e38a9fabb4de096bf386b7be988b7f7c5e4c58e
      TARGET_VERMAGIC: "-qgki-gd2a1055adeb0"
      # 依据手机 /proc/version 实机确认：
      #   "Android (6877366 based on r383902b1) clang version 11.0.2"
      # 所以是 clang-r383902b，不是 build.config.common 里写的 r416183b(12.0.5)。
      CLANG_VER: clang-r383902b

    steps:
      - uses: actions/checkout@v4

      # 内核 LTO 构建吃磁盘，先腾出 20G+
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            python3 zip unzip cpio kmod device-tree-compiler curl git \
            libncurses5 libtinfo5 || \
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            python3 zip unzip cpio kmod device-tree-compiler curl git

      - name: Fetch kernel source
        run: |
          set -e
          git init -q k
          cd k
          git remote add origin "$KERNEL_REPO"
          git fetch -q --depth=1 origin "$KERNEL_SHA"
          git checkout -q FETCH_HEAD
          echo "source: $(git log --oneline -1)"
          head -4 Makefile
          grep -q 'SUBLEVEL = 254' Makefile || { echo "::error::源码不是 5.4.254"; exit 1; }

      # 工作树会变 dirty，去掉 version 尾巴上的 "+"
      - name: Neutralise setlocalversion "+"
        run: |
          cd k
          sed -i 's|res="$res${scm:++}"|res="$res"|' scripts/setlocalversion
          grep -n 'res="\$res' scripts/setlocalversion | head -3

      - name: Fetch AOSP clang (clang 11.0.2 / r383902b)
        run: |
          mkdir -p "$HOME/clang"
          BASE="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive"
          # AOSP 会定期从 main 分支清掉老版本 clang 预编译包，r383902b(2020) 已不在 main 上。
          # 因此优先用 tag 快照（tag 不可变，目录还在）。
          urls="
          $BASE/refs/tags/android-11.0.0_r48/clang-r383902b.tar.gz
          $BASE/refs/tags/android-11.0.0_r46/clang-r383902b.tar.gz
          $BASE/refs/tags/android-11.0.0_r39/clang-r383902b.tar.gz
          $BASE/refs/tags/android-11.0.0_r48/clang-r383902.tar.gz
          $BASE/refs/tags/android-12.0.0_r1/clang-r383902b.tar.gz
          $BASE/refs/heads/main/clang-r383902b.tar.gz
          "
          ok=0
          for url in $urls; do
            rm -f /tmp/clang.tar.gz /tmp/curlerr
            code=$(curl -sSL -S --max-time 900 -o /tmp/clang.tar.gz -w '%{http_code}' "$url" 2>/tmp/curlerr || true)
            size=$(wc -c < /tmp/clang.tar.gz 2>/dev/null || echo 0)
            echo "  http=$code size=${size}B  $url"
            [ -s /tmp/curlerr ] && echo "    curl: $(head -1 /tmp/curlerr)"
            if [ "$code" = "200" ] && [ "$size" -gt 20000000 ]; then
              if tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"; then ok=1; echo "  -> 解压完成"; break; fi
            fi
          done
          [ "$ok" = "1" ] || { echo "::error::clang 预编译包下载失败（所有来源均不可用，见上方 http 状态码）"; exit 1; }
          "$HOME/clang/bin/clang" --version
          "$HOME/clang/bin/clang" --version | grep -q 'version 11\.0\.'
          "$HOME/clang/bin/clang" --version | grep -q 'version 11\.0\.2' \
            || echo "::warning::clang 不是 11.0.2，CFI 类型哈希可能与厂商模块不一致"
          ls "$HOME/clang/bin" | grep -E '^(clang|ld\.lld|llvm-nm|llvm-objcopy|llvm-strip)$' || true

      - name: Apply Droidspaces kABI patches
        run: |
          cd k
          patch -p1 --fuzz=3 --verbose < ../patches/droidspaces-5.4-kabi.patch

      - name: Configure
        run: |
          set -e
          cd k
          export PATH="$HOME/clang/bin:$PATH"
          cp ../config/device-stock.config .config

          # vermagic 逐字对齐原厂（值以 "-" 开头，交给 sed 处理更稳）
          sed -i 's|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION="'"$TARGET_VERMAGIC"'"|' .config
          sed -i 's|^CONFIG_LOCALVERSION_AUTO=.*|# CONFIG_LOCALVERSION_AUTO is not set|' .config
          grep -E '^CONFIG_LOCALVERSION' .config | tee /dev/stderr | grep -q 'gd2a1055adeb0' \
            || { echo "::error::LOCALVERSION 没写对"; exit 1; }

          # 叠加 Droidspaces 配置
          cat ../config/droidspaces.config >> .config

          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" olddefconfig

          echo "=== 关键配置复查（依据 Droidspaces 官方 GKI 清单）==="
          # 缺任意一项：容器直接起不来 / 硬件不可用 —— 硬失败
          # olddefconfig 会静默丢弃依赖不满足的项，所以必须逐条 grep 验证
          fatal="CFI_CLANG NAMESPACES PID_NS UTS_NS IPC_NS SYSVIPC POSIX_MQUEUE DEVTMPFS SECCOMP SECCOMP_FILTER CGROUPS MEMCG"
          for sym in $fatal; do
            if grep -q "^CONFIG_${sym}=y" .config; then
              printf "  ok    CONFIG_%s=y\n" "$sym"
            else
              echo "::error::CONFIG_${sym} 没开，容器会起不来"; exit 1
            fi
          done

          # 这两项开了会动 kABI，原厂模块全部拒载 —— 必须确认是关的
          for sym in CFS_BANDWIDTH CGROUP_PIDS; do
            if grep -q "^CONFIG_${sym}=y" .config; then
              echo "::error::CONFIG_${sym} 被打开了，会破坏 kABI 导致厂商模块拒载"; exit 1
            fi
          done

          # 推荐项：缺了功能打折，但不影响启动
          for sym in USER_NS NETFILTER_XT_MATCH_ADDRTYPE IP6_NF_NAT MACVLAN TMPFS_XATTR \
                     BLK_DEV_LOOP EXT4_FS OVERLAY_FS FUSE_FS TUN VETH BRIDGE NET_NS; do
            grep -q "^CONFIG_${sym}=y" .config || echo "::warning::CONFIG_${sym} 未开启（功能受限）"
          done

          grep -E '^CONFIG_LOCALVERSION' .config
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set' .config || { echo "::error::LOCALVERSION_AUTO 没关掉，vermagic 会带脏尾"; exit 1; }

      - name: Build Image
        run: |
          set -euo pipefail
          cd k
          export PATH="$HOME/clang/bin:$PATH"
          echo "runner: $(nproc) cores / $(free -g | awk '/^Mem:/{print $2}') GB RAM"
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" Image 2>&1 | tee ../build.log
          ls -l arch/arm64/boot/Image
          echo "=== 产物自检 ==="
          grep -m2 '__cfi_slowpath' System.map || { echo "::error::System.map 里没有 __cfi_slowpath，CFI 没编进去"; exit 1; }
          if strings arch/arm64/boot/Image | grep -q '5\.4\.254-qgki-gd2a1055adeb0+'; then
            echo "::error::内核版本串带了 + ，模块会全部拒载"
            exit 1
          fi
          strings arch/arm64/boot/Image | grep -m2 'Linux version 5\.4\.254'
          # Module.symvers 是下一步 CRC 校验的输入。正常 make vmlinux 会生成；
          # 万一没生成，补跑 modpost 而不是静默跳过校验。
          if [ ! -s Module.symvers ]; then
            echo "!! Module.symvers 缺失，补跑 modules"
            make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
              KCFLAGS="-D__ANDROID_COMMON_KERNEL__" modules 2>&1 | tail -20
          fi
          [ -s Module.symvers ] || { echo "::error::Module.symvers 生成失败，无法校验 CRC"; exit 1; }
          echo "Module.symvers 行数: $(wc -l < Module.symvers)"

      # 关键一步：拿新内核的 Module.symvers 跟手机里 99 个厂商模块要求的 CRC 对一遍
      - name: Verify vendor module CRCs
        id: crc
        continue-on-error: true
        run: |
          set -euo pipefail
          gunzip -c checks/vendor-crc-baseline.json.gz > /tmp/baseline.json
          ls -l k/Module.symvers
          python3 checks/check_vendor_crc.py verify /tmp/baseline.json k/Module.symvers | tee crc-report.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus9-droidspaces-${{ github.run_number }}
          path: |
            k/arch/arm64/boot/Image
            k/Module.symvers
            k/.config
            k/System.map
            build.log
            crc-report.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Gate
        if: steps.crc.outcome == 'failure'
        run: |
          echo "::error::厂商模块 CRC 不匹配，这个内核刷进去会起不来，不要下载使用"
          exit 1
